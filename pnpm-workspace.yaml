# One package, at the repo root. There is no `packages:` glob, and this file exists
# for the SETTINGS below — pnpm 11 reads them here and nowhere else.
#
# Two migrations are load-bearing and both fail at INSTALL time, in messages that
# name neither this file nor the setting:
#
#   - `pnpm.onlyBuiltDependencies` / `ignoredBuiltDependencies` in package.json are
#     removed in pnpm 11. `allowBuilds` replaces them, and it lives here.
#   - non-auth settings in `.npmrc` are no longer read. `autoInstallPeers`,
#     `strictPeerDependencies` and `verifyDepsBeforeRun` are camelCase keys here.
#
# `verifyDepsBeforeRun: false` is not a preference. A non-zero `prepare` script (this
# package builds with tsdown on `prepare`, so a git-URL install produces a runnable
# `dist/`) otherwise makes every subsequent `pnpm exec` fail with an opaque error
# pointing into pnpm's internals rather than at the build that broke.
autoInstallPeers: true
strictPeerDependencies: false
verifyDepsBeforeRun: false

# Every dependency that ships a build script gets a decision here, because an
# UNDECIDED entry makes `pnpm install --frozen-lockfile` interactive and CI hangs or
# fails on it. A placeholder string is not a decision.
allowBuilds:
  esbuild: true
  lefthook: true
  # z3-solver ships prebuilt WASM (`build/z3-built.{js,wasm}`) and declares no install
  # hook, so this is belt-and-braces: if a future release adds one, the decision is
  # already recorded rather than discovered as an interactive prompt in CI.
  z3-solver: true
  # A msgpackr optional native accelerator pulled in transitively by rolldown
  # (tsdown). Its JS fallback is complete, so declining the native build costs
  # nothing.
  msgpackr-extract: false
  # onnxruntime-web's transitive baggage. None of the three needs its build script:
  # onnxruntime-node is the NODE backend and symspec deliberately runs the web/WASM
  # one, protobufjs's script only regenerates bundled artifacts it already ships, and
  # sharp without its native build is simply unused.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
