# The donor (symspec v4) remains the workspace ROOT package — pnpm always treats
# the root as a project, so it keeps building without appearing in this glob.
# `packages/*` adds the v5 greenfield (`packages/symspec`) alongside it.
#
# BOTH declare the name `symspec`, and only the ROOT is still `private: true`.
# That asymmetry is the G5 publish posture: the greenfield is the package that
# OWNS the published name, the donor is frozen as the differential oracle and must
# never reach a registry. pnpm resolves workspace projects by path rather than by
# name, so the duplicate label stays a workspace-internal detail — verified with
# `pnpm install --frozen-lockfile` after the flip.
packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  # A msgpackr optional native accelerator pulled in transitively by rolldown
  # (tsdown). Its JS fallback is complete, so declining the native build costs
  # nothing and keeps `pnpm install` non-interactive (S2 spike hit this prompt).
  msgpackr-extract: false
  # onnxruntime-web's transitive baggage. None of the three needs its build
  # script: onnxruntime-node is the NODE backend and symspec deliberately runs
  # the web/WASM one, protobufjs's script only regenerates bundled artifacts it
  # already ships, and sharp without its native build is simply unused. All
  # three declined so `pnpm install --frozen-lockfile` stays non-interactive —
  # a placeholder string here ("set this to…") is what killed CI at install.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
