[tools]
node = "24"
# pnpm is provided by corepack (bundled with node); the exact version is pinned
# by `packageManager` in package.json (pnpm@11.1.1), which corepack reads
# natively. Not declared as a mise tool to avoid a second, conflicting owner.

# Optional system solver/certify binaries (AC-4-9, AC-4-10, AC-5-4, AC-7-6).
# These are the OPTIONAL SYSTEM binaries — a different thing from the npm
# runtime dependencies (z3-solver, wink-nlp, wink-eng-lite-web-model) in
# package.json. symspec's default `check` runs the in-process z3-solver WASM
# backend and needs NONE of these; they are only for the `--solver z3-bin`
# cross-check (external z3/cvc5) and the opt-in `certify` tier (Lean/elan).
# Uncomment to pin them locally; installed via mise's `github:` backend.
#
# "z3" = "github:Z3Prover/z3@z3-4.16.0"   # external z3 binary cross-check (ERR_SOLVER_MISSING suggests this exact pin)
# "cvc5" = "github:cvc5/cvc5@cvc5-1.2.0"  # alternate external SMT backend for the portable .smt2 artifact
# "elan" = "github:leanprover/elan"       # Lean toolchain manager for `symspec certify` (ERR_LEAN_TOOLCHAIN_MISSING suggests `elan default stable`)

[tasks.install]
description = "Install dependencies from lockfile"
run = "pnpm install"

[tasks.build]
description = "Compile TypeScript to dist/"
run = "pnpm build"

[tasks.test]
description = "Run vitest unit tests"
run = "pnpm vitest run"

[tasks.lint]
description = "Lint + format check (biome)"
run = "pnpm biome check ."

[tasks."lint:fix"]
description = "Lint + format auto-fix (biome)"
run = "pnpm biome check . --write"

[tasks.typecheck]
description = "tsc --noEmit"
run = "pnpm typecheck"

[tasks.knip]
description = "Find unused files, deps, and exports"
run = "pnpm knip"

[tasks.check]
description = "Full quality gate: biome ci + typecheck + vitest + knip"
depends = ["lint", "typecheck", "test", "knip"]
