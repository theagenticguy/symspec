name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here — pnpm/action-setup ERRORS when the workflow pins a
      # version while package.json's `packageManager` field also pins one. The
      # packageManager pin is the single source of truth.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `prepare: tsdown` runs here, so `dist/` exists before anything else does.
      - run: pnpm install --frozen-lockfile

      # `pnpm check` = biome ci + tsc --noEmit + check:agents (AGENTS.md drift) +
      # gate:reachability (the unbounded tier's feasibility + latency budget) +
      # build + vitest run + knip.
      #
      # ONE `run:` on purpose. Splitting the steps out is how the hook, this
      # workflow, and `mise run check` drift into gating different things — and the
      # ORDER matters: the CLI suite spawns `dist/cli.mjs`, so `build` has to precede
      # `vitest` or the tests exercise whatever the last build left behind.
      - run: pnpm check
