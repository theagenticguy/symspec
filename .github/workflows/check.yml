name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup@v4 ERRORS when the workflow pins a
      # version while package.json's `packageManager` field also pins one. The
      # packageManager pin (pnpm@11.1.1) is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm check` = biome ci + tsc --noEmit + check:agents (AGENTS.md drift)
      # + gate:temporal (AC-2-8 bounded-LTL feasibility/polarity) + vitest run
      # + knip. The two tsx-driven gates were pre-push-only before AC-2-8, which
      # meant a contributor without the hook installed — and every CI path —
      # never ran them. Keeping them inside `pnpm check` is what makes this one
      # `run:` the whole merge gate; do not split them back out.
      - run: pnpm check
