pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: '*.{ts,js,mjs,json,jsonc}'
      root: packages/symspec/
      run: ../../node_modules/.bin/biome check --no-errors-on-unmatched --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    # One job, not five. `check` is `biome ci` + `tsc --noEmit` + the AGENTS.md
    # drift gate + the reachability feasibility gate + `build` + `vitest run`, in
    # that order — and the order is the point: the CLI suite spawns
    # `dist/cli.mjs`, so a bare `vitest run` tests whatever the last build left
    # behind. Listing the steps separately here is how they drift out of that
    # order, and it is also how CI and the hook end up gating different things.
    - name: check
      root: packages/symspec/
      run: pnpm check
