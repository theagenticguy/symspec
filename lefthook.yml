pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: '*.{ts,js,mjs,json,jsonc}'
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: ./node_modules/.bin/tsc --noEmit

    - name: test
      run: ./node_modules/.bin/vitest run

    - name: biome-ci
      run: ./node_modules/.bin/biome ci .

    - name: knip
      run: ./node_modules/.bin/knip --no-progress

    - name: agents-md-drift
      run: pnpm run check:agents

    # AC-2-8 committed feasibility gate: the bounded temporal tier must still
    # refute the conflicting fixture, stay silent on the satisfiable one, and
    # land inside `LATENCY_BUDGET_MS` (exit 1 infeasible / 2 crash). Also in
    # `pnpm check`, so GitHub CI runs it too — this job only shortens the
    # feedback loop for anyone with the hook installed.
    - name: temporal-feasibility-gate
      run: pnpm run gate:temporal
